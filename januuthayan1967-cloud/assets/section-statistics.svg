<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 85" width="100%" height="85">
  <defs>
    <linearGradient id="bgGrad_4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090E" />
      <stop offset="50%" stop-color="#0E1017" />
      <stop offset="100%" stop-color="#06070A" />
    </linearGradient>

    <linearGradient id="goldGrad_4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="25%" stop-color="#FFF2B2" />
      <stop offset="50%" stop-color="#DAA520" />
      <stop offset="75%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#FFF2B2" />
    </linearGradient>

    <linearGradient id="borderGrad_4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0" />
      <stop offset="20%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFF8D6" stop-opacity="1" />
      <stop offset="80%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>

    <filter id="softGlow_4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      letter-spacing: 3.5px;
    }
    .mono-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10.5px;
      letter-spacing: 2px;
    }
  </style>

  <!-- Background Base Container -->
  <rect width="800" height="85" rx="8" fill="url(#bgGrad_4)" stroke="#222530" stroke-width="1" />

  <!-- Architectural Gold Accent Hairlines -->
  <rect x="40" y="0" width="720" height="1.5" fill="url(#borderGrad_4)" />
  <rect x="40" y="83.5" width="720" height="1.5" fill="url(#borderGrad_4)" />

  <!-- Corner Crosshairs -->
  <g stroke="#D4AF37" stroke-width="1" opacity="0.65">
    <path d="M 12 18 L 12 10 L 20 10" fill="none" />
    <path d="M 788 18 L 788 10 L 780 10" fill="none" />
    <path d="M 12 67 L 12 75 L 20 75" fill="none" />
    <path d="M 788 67 L 788 75 L 780 75" fill="none" />
  </g>

  <!-- Left Icon Emblem -->
  <g transform="translate(48, 42.5)">
    <!-- Hexagon Outer -->
    <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#12141C" stroke="url(#goldGrad_4)" stroke-width="1.2" />
    <!-- Icon Glyph -->
    <path d="M -12,12 L -6,4 L 0,8 L 8,-4 L 14,0 M -12,14 L 14,14" fill="none" stroke="url(#goldGrad_4)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Eyebrow Subtitle -->
  <text x="82" y="32" fill="#C5A059" class="mono-text" opacity="0.95">
    CODE DISTRIBUTION &amp; VELOCITY
  </text>

  <!-- Primary Section Title -->
  <text x="82" y="58" fill="url(#goldGrad_4)" class="title-text" font-size="20" filter="url(#softGlow_4)">
    GITHUB TELEMETRY &amp; ANALYTICS
  </text>

  <!-- Right Watermark / Node Coordinates -->
  <g transform="translate(735, 42.5)" opacity="0.8">
    <text x="0" y="-8" text-anchor="end" fill="#D4AF37" class="mono-text" font-size="9.5" font-weight="700">
      05 // TELEMETRY
    </text>
    <line x1="-120" y1="4" x2="0" y2="4" stroke="url(#borderGrad_4)" stroke-width="0.8" />
    <circle cx="0" cy="4" r="2" fill="#FFF2B2" />
  </g>
</svg>