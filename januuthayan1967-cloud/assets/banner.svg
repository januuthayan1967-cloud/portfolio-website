<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060608" />
      <stop offset="50%" stop-color="#0A0B10" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B38728" />
      <stop offset="25%" stop-color="#FBF5B7" />
      <stop offset="50%" stop-color="#DAA520" />
      <stop offset="75%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#FBF5B7" />
    </linearGradient>

    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF5B7" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8C6D23" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0" />
      <stop offset="20%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFF8D6" stop-opacity="1" />
      <stop offset="80%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Ambient Flares -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#B8860B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cornerFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBF5B7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.18; transform: scale(1); }
      50% { opacity: 0.28; transform: scale(1.04); }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .ambient-glow {
      transform-origin: 50% 45%;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .beacon-dot {
      transform-origin: center;
      animation: beaconBlink 2s ease-in-out infinite;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      letter-spacing: 6px;
    }
    .text-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      letter-spacing: 3.5px;
    }
    .text-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 11.5px;
      letter-spacing: 2px;
    }
  </style>

  <!-- Deep Void Background Canvas -->
  <rect width="1200" height="420" fill="url(#bgGradient)" rx="16" />

  <!-- Architectural Engineering Grid Pattern -->
  <g opacity="0.08" stroke="#D4AF37" stroke-width="0.75">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="320" y1="0" x2="320" y2="420" />
    <line x1="440" y1="0" x2="440" y2="420" />
    <line x1="560" y1="0" x2="560" y2="420" />
    <line x1="680" y1="0" x2="680" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="920" y1="0" x2="920" y2="420" />
    <line x1="1040" y1="0" x2="1040" y2="420" />
    <line x1="1120" y1="0" x2="1120" y2="420" />

    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" />
  </g>

  <!-- Radial Golden Ambient Flare -->
  <circle cx="600" cy="190" r="320" fill="url(#centerGlow)" class="ambient-glow" />

  <!-- Constellation Accent Coordinates & Nodes -->
  <g opacity="0.45" stroke="#D4AF37" stroke-width="0.8">
    <circle cx="160" cy="100" r="2.5" fill="#FFF8D6" />
    <circle cx="260" cy="70" r="1.5" fill="#D4AF37" />
    <circle cx="220" cy="160" r="2" fill="#D4AF37" />
    <line x1="160" y1="100" x2="260" y2="70" />
    <line x1="160" y1="100" x2="220" y2="160" />

    <circle cx="1040" cy="100" r="2.5" fill="#FFF8D6" />
    <circle cx="940" cy="70" r="1.5" fill="#D4AF37" />
    <circle cx="980" cy="160" r="2" fill="#D4AF37" />
    <line x1="1040" y1="100" x2="940" y2="70" />
    <line x1="1040" y1="100" x2="980" y2="160" />
  </g>

  <!-- Luxury Metallic Header & Footer Hairlines -->
  <rect x="60" y="1" width="1080" height="1.5" fill="url(#goldBorderGrad)" />
  <rect x="60" y="418" width="1080" height="1.5" fill="url(#goldBorderGrad)" />

  <!-- Architectural Corner Crosshairs -->
  <g stroke="#D4AF37" stroke-width="1.2" opacity="0.65">
    <!-- Top-Left -->
    <path d="M 28 42 L 28 28 L 42 28" fill="none" />
    <circle cx="28" cy="28" r="1.5" fill="#FFF8D6" />
    <!-- Top-Right -->
    <path d="M 1158 28 L 1172 28 L 1172 42" fill="none" />
    <circle cx="1172" cy="28" r="1.5" fill="#FFF8D6" />
    <!-- Bottom-Left -->
    <path d="M 28 378 L 28 392 L 42 392" fill="none" />
    <circle cx="28" cy="392" r="1.5" fill="#FFF8D6" />
    <!-- Bottom-Right -->
    <path d="M 1158 392 L 1172 392 L 1172 378" fill="none" />
    <circle cx="1172" cy="392" r="1.5" fill="#FFF8D6" />
  </g>

  <!-- Central Crest / Hexagonal Monogram -->
  <g transform="translate(600, 72)" filter="url(#goldGlow)">
    <!-- Hexagon Outer Border -->
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="#0C0D12" stroke="url(#goldGradient)" stroke-width="1.8" />
    <!-- Inner Bevel Accent -->
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.5" />
    <!-- Monogram Glyph V -->
    <path d="M -8,-9 L -3,11 L 3,11 L 8,-9 L 4,-9 L 0,6 L -4,-9 Z" fill="url(#goldGradient)" />
  </g>

  <!-- Eyebrow: Candidate Full Official Name -->
  <text x="600" y="138" text-anchor="middle" fill="#C5A059" class="text-mono" font-size="12.5" letter-spacing="3.5px" opacity="0.95">
    UTHAYAGUNASINGAM VANOJAN
  </text>

  <!-- Primary Headline: VANOJAN -->
  <g filter="url(#softShadow)">
    <text x="600" y="196" text-anchor="middle" fill="url(#goldGradient)" class="text-title" font-size="44" letter-spacing="9px">
      VANOJAN
    </text>
  </g>

  <!-- Accent Divider with Diamond Node -->
  <g transform="translate(600, 216)">
    <line x1="-190" y1="0" x2="-20" y2="0" stroke="url(#goldBorderGrad)" stroke-width="1" />
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#FFF8D6" stroke="#D4AF37" stroke-width="0.8" />
    <line x1="20" y1="0" x2="190" y2="0" stroke="url(#goldBorderGrad)" stroke-width="1" />
  </g>

  <!-- Primary Professional Title -->
  <text x="600" y="250" text-anchor="middle" fill="#FFFFFF" class="text-subtitle" font-size="17.5" opacity="0.95">
    SOFTWARE ENGINEERING GRADUATE | FULL-STACK DEVELOPER
  </text>

  <!-- Core Engineering Disciplines -->
  <text x="600" y="284" text-anchor="middle" fill="#A0A5B2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" letter-spacing="1.2">
    Full-Stack Systems <tspan fill="#D4AF37">✦</tspan> Native Android Architecture <tspan fill="#D4AF37">✦</tspan> AI-Integrated Solutions
  </text>

  <!-- Verified Academic Line (Awaiting Final Results explicitly stated) -->
  <text x="600" y="316" text-anchor="middle" fill="#757B8A" class="text-mono" font-size="10.8">
    BSc (Hons) Software Engineering Candidate (Results Pending) • ICBT / Cardiff Metropolitan University, UK
  </text>

  <!-- Status Pill: Available for Opportunities -->
  <g transform="translate(600, 362)">
    <!-- Pill Container -->
    <rect x="-195" y="-15" width="390" height="30" rx="15" fill="#0E1017" stroke="url(#goldGradient)" stroke-width="1" opacity="0.9" />
    <!-- Active Emerald Beacon Dot -->
    <circle cx="-165" cy="0" r="4.5" fill="#10B981" class="beacon-dot" />
    <circle cx="-165" cy="0" r="8" fill="#10B981" opacity="0.25" />
    <!-- Status Text -->
    <text x="-148" y="4" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">
      AVAILABLE FOR GRADUATE SOFTWARE ENGINEER ROLES
    </text>
  </g>
</svg>
